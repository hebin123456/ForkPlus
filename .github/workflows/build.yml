# ForkPlus 四平台自动构建与发布
#
# 触发：push v* 标签 / 手动（workflow_dispatch，仅构建+测试不发 Release）
# 产物：self-contained publish 目录（自带 .NET 10 运行时，目标机无需安装任何框架）。
#       主程序与 AskPass/RI 两个 git 子进程 helper 三 exe 全部自包含发布到同一目录
#       （helper 由 git 以独立进程拉起，漏掉它们则无运行时机器上凭证输入/交互式变基
#       直接挂）。含各平台 biturbo native 库（构建期由 workflow 显式 curl +
#       ForkPlus.csproj 的 RestoreBiturbo Target 兜底，从 hebin123456/Biturbo latest release 拉取：
#       win→biturbo.dll / linux→libbiturbo.so（arm64 资产名为 libbiturbo-arm64.so）
#       / macos→libbiturbo.dylib）+ tokei 代码统计工具
#       （hebin123456/tokei latest release：win→tokei.exe / unix→tokei，Linux/macOS 为 tar.gz 需解压，
#       linux-arm64 用 tokei-aarch64-unknown-linux-gnu.tar.gz）+
#       OxyPlot.Avalonia 图表库 nupkg（hebin123456/oxyplot-avalonia fork latest release，
#       下载到 third_party/nuget/ 本地 NuGet 源，经 nuget.config + PackageReference 恢复）。
#       linux-x64 自包含实测约 125M。
#
# 发布链：build（四平台矩阵）+ test（ubuntu 五分片并行矩阵）全绿 → release job 下载
#       四平台 artifact、各自打 zip（ForkPlus-<version>-<platform>.zip）、从 RELEASE_NOTE.md
#       提取当前版本章节作为正文，softprops/action-gh-release 发布（generate_release_notes
#       追加自动变更清单与 Full Changelog 对比链接）。未打 tag 的手动运行只出 Artifacts。
#
# 平台对应关系（与 Biturbo release 资产架构一致）：
#   windows-latest   → x64（biturbo.dll = x86_64）
#   ubuntu-latest    → x64（libbiturbo.so = x86_64）
#   ubuntu-22.04-arm → arm64（libbiturbo-arm64.so = aarch64，GitHub 原生 ARM64 runner，
#                      公开仓库免费；glibc 2.35 与 linux-x64 基线一致）
#   macos-latest     → arm64（libbiturbo.dylib = arm64，Apple Silicon）
#
# 注意：UI 冒烟测试已归一到 ForkPlus.Tests 的 Avalonia.Headless（跨平台，随单测一起跑），
#       原 Windows-only FlaUI 套件 ForkPlus.AutomationTests 已删除（2026-09-02）。
#       build job 只构建主工程 ForkPlus.csproj（ProjectReference 会带出 AskPass/RI）；
#       全量单元 + E2E 测试在独立 test job（ubuntu x64，2026-09-09 起五分片并行矩阵，
#       详见 test job 头注释）运行。

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            rid: win-x64
            platformtarget: x64
          - os: ubuntu-latest
            name: linux-x64
            rid: linux-x64
            platformtarget: x64
          # Linux ARM64：GitHub 原生 ARM64 runner（公开仓库免费），原生 dotnet publish，
          # 不做交叉发布（-r linux-arm64 在 x64 上交叉也可行，原生构建更接近真实目标机，
          # 且 SkiaSharp/HarfBuzzSharp 的 linux-arm64 native 包会按 RID 自动解析）。
          - os: ubuntu-22.04-arm
            name: linux-arm64
            rid: linux-arm64
            platformtarget: arm64
          - os: macos-latest
            name: macos-arm64
            rid: osx-arm64
            platformtarget: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # OxyPlot.Avalonia 改为消费 fork（hebin123456/oxyplot-avalonia）release 的预编译 nupkg：
      # 本地 NuGet 源 third_party/nuget/（nuget.config 已注册该目录），csproj 以 PackageReference
      # 引用（版本 2.1.2-avalonia12.1，由 ForkPlus.csproj 的 OxyPlotAvaloniaPackageVersion 单点维护）。
      # 包按 Avalonia 12.1.1 原生编译——官方版按 11 编译的 XAML IL 在 12 运行时会
      # MissingMethodException（PlotView 首布局即崩，迁移期模块20 用例实锤），fork 发包从根上
      # 解决，CI 不再克隆源码打补丁。
      # 与 tokei / biturbo 同模式显式下载（不走 csproj 的 RestoreOxyPlotAvalonia Exec，规避
      # macOS runner 上 MSBuild Exec 行为差异；Exists 守卫直接短路）。资产名含版本号
      # （NuGet 目录源要求 <id>.<version>.nupkg 命名），升级时与 ForkPlus.csproj 同步。
      - name: Download OxyPlot.Avalonia nupkg
        shell: bash
        run: |
          mkdir -p third_party/nuget
          base="https://github.com/hebin123456/oxyplot-avalonia/releases/latest/download"
          asset="OxyPlot.Avalonia.2.1.2-avalonia12.1.nupkg"
          out="third_party/nuget/$asset"
          echo "Downloading $asset ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$asset" -o "$out"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $asset after 5 attempts"; exit 1; }
          ls -la "$out"
          # 非空且 >10KB 校验（实际约数百 KB；拦 0 字节/截断残留）
          size=$(wc -c < "$out")
          [ "$size" -gt 10000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      # native 库下载走显式 step 而非只靠 csproj 的 RestoreBiturbo Target
      # —— macOS runner 上该 MSBuild Exec 未产出 dylib（Linux/Windows 均正常，minimal
      # verbosity 下 Exec stdout 也不进日志，无从诊断），改为 workflow 显式 curl：
      # 日志可见、重试明确、每平台文件名写死，下载后 csproj 的 Exists 守卫直接短路。
      # asset 是 Biturbo release 里的资产名（Linux ARM64 为 libbiturbo-arm64.so），
      # out 是 third_party/ 落地名——运行时 DllImport 的库名固定是 libbiturbo.so。
      - name: Download biturbo native library
        shell: bash
        run: |
          mkdir -p third_party
          base="https://github.com/hebin123456/Biturbo/releases/latest/download"
          case "${{ matrix.name }}" in
            windows-x64) asset=biturbo.dll;         out=biturbo.dll ;;
            linux-x64)   asset=libbiturbo.so;       out=libbiturbo.so ;;
            linux-arm64) asset=libbiturbo-arm64.so; out=libbiturbo.so ;;
            macos-arm64) asset=libbiturbo.dylib;    out=libbiturbo.dylib ;;
          esac
          echo "Downloading $asset -> third_party/$out ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$asset" -o "third_party/$out"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $asset after 5 attempts"; exit 1; }
          ls -la "third_party/$out"
          # 非空且 >1MB 校验（biturbo 约 2-3MB；curl 失败残留 0 字节文件的情况要拦住）
          size=$(wc -c < "third_party/$out")
          [ "$size" -gt 1000000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      # tokei 与 biturbo 同模式显式下载（不走 csproj 的 RestoreTokei Exec，
      # 规避 macOS runner 上 MSBuild Exec 行为差异）。四平台资产：
      #   windows → tokei-x86_64-pc-windows-msvc.exe（裸 exe，存为 tokei.exe）
      #   linux-x64 → tokei-x86_64-unknown-linux-gnu.tar.gz（tar 内是裸 tokei，解压存为 tokei）
      #   linux-arm64 → tokei-aarch64-unknown-linux-gnu.tar.gz（同上，aarch64 资产）
      #   macos   → tokei-x86_64-apple-darwin.tar.gz（同上；release 暂无 aarch64-apple-darwin
      #             资产，arm64 目标机经 Rosetta 2 运行——CI 只打包不执行，不受影响）
      - name: Download tokei
        shell: bash
        run: |
          mkdir -p third_party
          base="https://github.com/hebin123456/tokei/releases/latest/download"
          case "${{ matrix.name }}" in
            windows-x64) asset="tokei-x86_64-pc-windows-msvc.exe"; out="third_party/tokei.exe"; bare=1 ;;
            linux-x64)   asset="tokei-x86_64-unknown-linux-gnu.tar.gz"; out="third_party/tokei"; bare=0 ;;
            linux-arm64) asset="tokei-aarch64-unknown-linux-gnu.tar.gz"; out="third_party/tokei"; bare=0 ;;
            macos-arm64) asset="tokei-x86_64-apple-darwin.tar.gz"; out="third_party/tokei"; bare=0 ;;
          esac
          echo "Downloading $asset ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$asset" -o "third_party/tokei-download"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $asset after 5 attempts"; exit 1; }
          if [ "$bare" = "1" ]; then
            mv "third_party/tokei-download" "$out"
          else
            # tar.gz 内是裸 tokei 二进制（无目录结构），解压到临时目录再就位
            tmp=$(mktemp -d)
            tar -xzf "third_party/tokei-download" -C "$tmp" || { echo "FAILED to extract $asset"; exit 1; }
            [ -f "$tmp/tokei" ] || { echo "archive does not contain bare 'tokei' binary"; ls -la "$tmp"; exit 1; }
            mv "$tmp/tokei" "$out"
            rm -rf "$tmp" "third_party/tokei-download"
          fi
          chmod +x "$out" || true
          ls -la "$out"
          # 非空且 >1MB 校验（解压后二进制约 2-7MB；拦 0 字节/截断残留）
          size=$(wc -c < "$out")
          [ "$size" -gt 1000000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      # RID-specific self-contained publish（免装 .NET 10 运行时）：
      # 主程序先发，AskPass/RI 随后发到同一目录。三工程共享同一份运行时文件
      # （同名同内容，后者覆盖前者），总增量只有一份运行时，linux-x64 实测约 125M。
      # helper 必须自包含：它们由 git 以独立进程拉起（SSH_ASKPASS / core.editor），
      # 主工程 PublishHelperExecutables 从 bin 拷来的 helper 三件套是框架依赖版 apphost，
      # 此处自包含发布会覆盖之（顺序不可倒：主程序在后会拷回框架依赖版 exe）。
      # 不带 -r 时 SDK 会把 NuGet 包里全部 18 个 RID 的 runtimes/ 复制进产物
      # （SkiaSharp/HarfBuzzSharp 全平台 so/dylib/dll + pdb 调试符号），Linux 包
      # 膨胀到 585M；带 -r 后只保留本平台。DebugType=none /
      # AllowedReferenceRelatedFileExtensions=none 去掉 pdb。
      # PlatformTarget 按 RID 传：csproj 固定 x64 会与 osx-arm64 冲突（NETSDK1032），
      # AskPass/RI csproj 同样写死 x64，一并覆盖。
      - name: Publish (self-contained)
        run: >
          dotnet publish src/ForkPlus/ForkPlus.csproj -c Release
          -r ${{ matrix.rid }} --self-contained true
          -p:PlatformTarget=${{ matrix.platformtarget }}
          -p:DebugType=none -p:AllowedReferenceRelatedFileExtensions=none
          -o publish/${{ matrix.rid }} --nologo

      - name: Publish helpers (self-contained)
        shell: bash
        run: |
          set -e
          for proj in src/ForkPlus.AskPass/ForkPlus.AskPass.csproj src/ForkPlus.RI/ForkPlus.RI.csproj; do
            dotnet publish "$proj" -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:PlatformTarget=${{ matrix.platformtarget }} \
              -p:DebugType=none -p:AllowedReferenceRelatedFileExtensions=none \
              -o "publish/${{ matrix.rid }}" --nologo
          done

      - name: Verify critical outputs
        shell: bash
        run: |
          cd "publish/${{ matrix.rid }}"
          # Windows 的 apphost 带 .exe 扩展名，Unix 是无扩展名可执行文件
          if [ "${{ matrix.name }}" = "windows-x64" ]; then ext=".exe"; else ext=""; fi
          missing=0
          for f in ForkPlus.dll ForkPlus.runtimeconfig.json \
                   "ForkPlus.AskPass${ext}" ForkPlus.AskPass.dll ForkPlus.AskPass.runtimeconfig.json ForkPlus.AskPass.deps.json \
                   "ForkPlus.RI${ext}" ForkPlus.RI.dll ForkPlus.RI.runtimeconfig.json ForkPlus.RI.deps.json OxyPlot.Avalonia.dll; do
            [ -f "$f" ] || { echo "MISSING: $f"; missing=1; }
          done
          case "${{ matrix.name }}" in
            windows-x64) native=biturbo.dll; tokei_file=tokei.exe; clr=coreclr.dll; policy=hostpolicy.dll ;;
            linux-x64)   native=libbiturbo.so; tokei_file=tokei; clr=libcoreclr.so; policy=libhostpolicy.so ;;
            linux-arm64) native=libbiturbo.so; tokei_file=tokei; clr=libcoreclr.so; policy=libhostpolicy.so ;;
            macos-arm64) native=libbiturbo.dylib; tokei_file=tokei; clr=libcoreclr.dylib; policy=libhostpolicy.dylib ;;
          esac
          [ -f "$native" ] || { echo "MISSING native: $native"; missing=1; }
          [ -f "$tokei_file" ] || { echo "MISSING tokei: $tokei_file"; missing=1; }
          # self-contained 断言：运行时组件必须随产物分发（缺了 = 变回框架依赖发布）
          [ -f "$clr" ] || { echo "MISSING self-contained runtime: $clr"; missing=1; }
          [ -f "$policy" ] || { echo "MISSING self-contained runtime: $policy"; missing=1; }
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All critical outputs present (native=$native, tokei=$tokei_file, self-contained runtime OK)."

      # 直接上传产物目录内容，不先打 zip：
      # GitHub Actions 下载 artifact 时本身就会自动包一层 zip（无法关闭），
      # 先自己打包再上传 = 解压一次拿到的是内层压缩包，还得再解压一次（两层嵌套）。
      # 上传目录内容（LCA = publish/<rid>）→ 下载的 artifact zip 解压即得全部文件，只有一层。
      # （Release 用的 zip 由 release job 在下载后统一打包，保持 artifact 单层不变。）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForkPlus-${{ matrix.name }}
          path: publish/${{ matrix.rid }}/*
          retention-days: 14
          if-no-files-found: error

  # ── 全量单元 + E2E 测试（发布门禁）──
  # 套件为 Avalonia.Headless（Skia 软件渲染，无显示服务器依赖），在 ubuntu-latest 跑
  # 全量 ~4500 用例（分片口径见下方矩阵注释）。环境依赖：
  #   ① OxyPlot.Avalonia —— 与 build job 同源：fork release 预编译 nupkg 下载到
  #      third_party/nuget/（本地 NuGet 目录源，nuget.config + PackageReference 恢复；
  #      官方版按 Avalonia 11 编译，12 运行时 PlotView 崩溃）；
  #   ② gitflow-avh：E2e17 GitFlow 真实链路（flow init/start/finish），纯净 git 没有
  #      git-flow 子命令；git 经 PATH 查找子命令（exec-path 方案无效），装到 /usr/local；
  #   ③ git-lfs：E2e18 LFS 真实链路（track/fetch/pull/lock）需要真实 git-lfs CLI，
  #      GitHub ubuntu runner 预装，此步仅校验版本；
  #   ④ biturbo native 库：ForkPlus.Tests.csproj 的 RestoreBiturbo target 构建期自动
  #      拉取（Linux 下 MSBuild Exec 正常，无需像 macOS 那样显式 curl）。
  # 仅在 Linux 跑（全量验证过的平台，Windows/macOS 暂不扩矩阵）。测试写仓库级
  # git config、像素断言为同帧相对比较（无固定参考图），不依赖环境字体/全局配置。
  # 已实证的环境差异修复：① GitHub runner 全局已 git lfs install → LFS 测试工厂的
  #   clone 会 smudge（改 -c 进程级关闭 lfs smudge）；② runner 无内置 git 实例 →
  #   SSH 测试的候选源断言改环境自适应；③ InteractiveRebase 选中框扫描改按索引
  #   定位第 0 行（视觉序首项在 runner 上与行序不一致）。
  # ── 测试（2026-09-09 起五分片并行矩阵）──
  # 背景：4500+ 用例挤在一个 job 里跑，"Run tests" 实测 ~17min。真正的串行瓶颈不是
  # 用例数，而是 112 个 UI 测试类共享 [Collection("HeadlessAvalonia")]——headless App
  # 是进程级单例 + 单 UI 线程，同一集合内用例必须逐个执行；xUnit 的集合并行救不了它
  # （单测们早已按类并行），单进程里这条串行链就是墙钟下限。
  # 分片原理：vstest --filter 按类名前缀把用例集切成互斥子集，每片一个独立 job =
  # 独立 testhost 进程。进程之间没有共享 UI 状态，HeadlessAvalonia 的串行约束只在
  # 各片内部生效，片与片之间由 Actions matrix 天然并行。按 2026-09-09 本地单类耗时
  # 实测均衡切分（runner 约慢 2.7x），测试墙钟 ~17min → ~8min。
  # 过滤器口径（vstest 的 ~ 为大小写不敏感的"包含"匹配，锚定 "ForkPlus.Tests." 命名
  # 空间前缀后等价于类名前缀匹配——方法名里的 "_E2E" 后缀（如 ShellToolUnixResolution
  # Tests）不会被误伤）：
  #   e2e-1/2/3 ：E2E 家族按模块号十位分组（E2e0*=01-09，E2e1*=10-19，E2e2*=20-28，
  #               E2e2 前缀顺带覆盖未来新增的 E2e29），两个无编号类 E2eInfraSmoke /
  #               E2eStageScrollbarRefresh 显式并入 e2e-3；AskPass/RI 两个秒级小工程
  #               （10+6 用例）搭最轻的 e2e-1 凑平衡。
  #   core-a/b  ：非 E2E 用例按类名首字母在 T 处切两半。T-W 片集中 Theme*/TextBox*
  #               等重量级 UI 类（实测 ~54s），A-S 片摊平其余——含 Class/Source 两个
  #               Coverage 清单类（1900+/1500+ 用例，但纯内存断言，各 <1s）。core-a
  #               是纯否定式 filter，须显式排除 AskPass/RI 命名空间（否则 solution 级
  #               命令会把这两个小工程的用例吸进来，与 e2e-1 片重叠——该重叠正是
  #               "分片完整性守卫"在开发期实锤抓到的第一只虫）。
  # 维护：新增 E2e3x 模块（E2e30+）时需显式扩 e2e-3 的 filter（E2e2 前缀覆盖不到
  # E2e3x，且会被 core 片的 !~ 排除）；否则 e2e-1 里的"分片完整性守卫"会红灯
  # （各片 --list-tests 求和 != 全量总数），不会静默丢覆盖。
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: e2e-1
            test-filter: "FullyQualifiedName~ForkPlus.Tests.E2e0|FullyQualifiedName~ForkPlus.AskPass|FullyQualifiedName~ForkPlus.RI"
          - shard: e2e-2
            test-filter: "FullyQualifiedName~ForkPlus.Tests.E2e1"
          - shard: e2e-3
            test-filter: "FullyQualifiedName~ForkPlus.Tests.E2e2|FullyQualifiedName~ForkPlus.Tests.E2eInfra|FullyQualifiedName~ForkPlus.Tests.E2eStage"
          - shard: core-a
            test-filter: "(FullyQualifiedName!~ForkPlus.Tests.E2e)&(FullyQualifiedName!~ForkPlus.AskPass)&(FullyQualifiedName!~ForkPlus.RI)&(FullyQualifiedName!~ForkPlus.Tests.T)&(FullyQualifiedName!~ForkPlus.Tests.U)&(FullyQualifiedName!~ForkPlus.Tests.V)&(FullyQualifiedName!~ForkPlus.Tests.W)"
          - shard: core-b
            test-filter: "(FullyQualifiedName!~ForkPlus.Tests.E2e)&(FullyQualifiedName~ForkPlus.Tests.T|FullyQualifiedName~ForkPlus.Tests.U|FullyQualifiedName~ForkPlus.Tests.V|FullyQualifiedName~ForkPlus.Tests.W)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 与 build job 的 "Download OxyPlot.Avalonia nupkg" 同一步骤（fork 预编译包，
      # 官方版按 Avalonia 11 编译运行时崩溃）。资产名含版本号，升级时与 ForkPlus.csproj
      # 的 OxyPlotAvaloniaPackageVersion 单点维护同步。
      - name: Download OxyPlot.Avalonia nupkg
        shell: bash
        run: |
          mkdir -p third_party/nuget
          base="https://github.com/hebin123456/oxyplot-avalonia/releases/latest/download"
          asset="OxyPlot.Avalonia.2.1.2-avalonia12.1.nupkg"
          out="third_party/nuget/$asset"
          echo "Downloading $asset ..."
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "$base/$asset" -o "$out"; then ok=1; break; fi
            echo "attempt $i failed, retrying in $((i*5))s..."
            sleep $((i*5))
          done
          [ "$ok" = "1" ] || { echo "FAILED to download $asset after 5 attempts"; exit 1; }
          ls -la "$out"
          # 非空且 >10KB 校验（实际约数百 KB；拦 0 字节/截断残留）
          size=$(wc -c < "$out")
          [ "$size" -gt 10000 ] || { echo "downloaded file too small: $size bytes"; exit 1; }

      # E2E 测试的变基链路（v4.0.5 起按 git 版本能力降级）：≥2.44 走 git replay 预检 +
      # --update-refs 原生路径；老版本自动降级 merge-tree / 省略选项。ubuntu-latest 自带
      # git 不够新（24.04 为 2.43），仍从 git-core PPA 装最新版——保证 CI 覆盖 replay /
      # update-refs 原生路径（降级路径由老 git 环境覆盖，如沙箱 2.34）。
      # 五个分片统一安装（分片间环境一致，排查"某片独有失败"时不用怀疑工具链差异）；
      # gitflow-avh（E2e17）/git-lfs（E2e18）在 e2e 分片按需用到。
      - name: Install modern git (>= 2.44)
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git
          git --version

      - name: Install gitflow-avh
        shell: bash
        run: |
          git clone --depth 1 https://github.com/petervanderdoes/gitflow-avh.git /tmp/gitflow-avh
          sudo make -C /tmp/gitflow-avh install
          git flow version

      - name: Verify git / git-lfs
        shell: bash
        run: |
          git --version
          git lfs version

      # 分片完整性守卫（只在最轻的 e2e-1 片跑，其余片省去）：从本 workflow 文件里提取
      # 全部 matrix test-filter（单一事实来源，不与 matrix 定义脱节），逐个 --list-tests
      # 计数求和，必须等于不带过滤器的全量总数。新增测试类落在所有分片之外（如 E2e30）
      # 或 filter 手误写岔时立即红灯，防止并行化悄悄吞掉覆盖。首次调用顺带完成构建，
      # 后续枚举与 Run tests 复用同一产物。
      - name: Verify shard partition (sum of shards == total)
        if: matrix.shard == 'e2e-1'
        shell: bash
        run: |
          mapfile -t FILTERS < <(grep -oP '^\s+test-filter:\s*"\K[^"]+' .github/workflows/build.yml)
          echo "discovered ${#FILTERS[@]} shard filters from workflow matrix"
          [ "${#FILTERS[@]}" -ge 2 ] || { echo "::error::未能从 workflow 提取分片 filter"; exit 1; }
          # 构建一次（增量），后续 --no-build 枚举秒级
          dotnet test ForkPlus.sln --list-tests --nologo > /dev/null
          total=$(dotnet test ForkPlus.sln --no-build --list-tests --nologo 2>/dev/null | grep -c '^    ')
          sum=0
          for f in "${FILTERS[@]}"; do
            n=$(dotnet test ForkPlus.sln --no-build --list-tests --nologo --filter "$f" 2>/dev/null | grep -c '^    ')
            echo "  $n tests  <- $f"
            sum=$((sum + n))
          done
          echo "shard sum = $sum, full total = $total"
          if [ "$sum" -ne "$total" ]; then
            echo "::error::分片不完整（sum=$sum != total=$total）：有测试类落在所有分片 filter 之外，或分片间有重叠。新增 E2e3x 模块需显式扩 e2e-3 的 filter。"
            exit 1
          fi

      # 各分片跑互斥子集（solution 级命令：构建全部工程含 AskPass/RI helper，与原单
      # job 完全同构；零匹配的工程只告警不失败，AskPass/RI 由 e2e-1 的 filter 覆盖）
      - name: Run tests
        shell: bash
        run: dotnet test ForkPlus.sln --nologo --filter "${{ matrix.test-filter }}"

      # 失败时上传证据截图（docs/evidence/，像素断言失败可下载 PNG 定位），便于 CI 红灯
      # 诊断；按分片命名，红灯时直接定位到是哪一片挂了
      - name: Upload test evidence (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.shard }}
          path: docs/evidence/
          retention-days: 7
          if-no-files-found: ignore

  # ── 发布（仅 tag 触发；手动 workflow_dispatch 只跑 build+test 不发 Release）──
  # build + test 全绿后：下载三平台 artifact → 各自打 zip（ForkPlus-<tag>-<platform>.zip，
  # 内层无嵌套）→ 从 RELEASE_NOTE.md 提取当前版本章节作为正文 → 发布 Release。
  # generate_release_notes 会自动追加 PR 变更清单与 "Full Changelog" 对比链接。
  release:
    name: Release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (for RELEASE_NOTE.md)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release zips
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          cd artifacts
          for name in ForkPlus-windows-x64 ForkPlus-linux-x64 ForkPlus-linux-arm64 ForkPlus-macos-arm64; do
            [ -d "$name" ] || { echo "MISSING artifact: $name"; exit 1; }
            zip -qr "ForkPlus-${tag}-${name#ForkPlus-}.zip" "$name"
            ls -la "ForkPlus-${tag}-${name#ForkPlus-}.zip"
          done

      # 提取 RELEASE_NOTE.md 中 "## v<版本>" 到下一个 "## v" 之间的正文；缺失时退化为占位。
      - name: Extract release notes for this tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v header="## v$tag" '
            $0 == header { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' RELEASE_NOTE.md | sed -e '/./,$!d' > release-body.md
          if [ ! -s release-body.md ]; then
            echo "ForkPlus $GITHUB_REF_NAME" > release-body.md
          fi
          echo "--- release body (first 30 lines) ---"
          head -30 release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ForkPlus-*-x64.zip
            artifacts/ForkPlus-*-arm64.zip
          body_path: release-body.md
          generate_release_notes: true
